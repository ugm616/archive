<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archive - Private Wiki</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>
  <a href="#main" class="skip-link">Skip to main content</a>
  <header class="site-header">
    <div class="header-inner">
      <a href="wiki.html" class="site-logo">...</a>
      <button id="theme-toggle" class="theme-toggle">...</button>
    </div>
    <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
      <svg class="icon-sun" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><g stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></g></svg>
      <svg class="icon-moon" aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>
  </header>
  <main id="main" class="main-content">
    <div class="container">
      <section class="search-section">
        <form class="search-form" role="search" aria-label="Search articles">
          <label for="search-input" class="visually-hidden">Search articles</label>
          <svg class="search-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="16" y1="16" x2="21" y2="21" stroke="currentColor" stroke-width="2"/></svg>
          <input type="search" id="search-input" class="search-input" placeholder="Search articles..." autocomplete="off" aria-describedby="search-hint">
          <span id="search-hint" class="visually-hidden">Type to filter articles by title, description, or content</span>
        </form>
        <div id="search-results-count" class="search-results-count" aria-live="polite"></div>
      </section>
      <nav class="tag-nav" id="tag-nav" aria-label="Filter by tags">
        <h2 class="visually-hidden">Filter by tags</h2>
        <div class="tag-list" id="tag-list"></div>
      </nav>
      <section class="articles-section" aria-label="Articles">
        <div class="articles-grid" id="articles-grid" role="list"></div>
        <div id="no-results" class="no-results" hidden>
          <p>No articles found matching your search.</p>
        </div>
      </section>
    </div>
  </main>
  <footer class="site-footer">
    <p>&copy; 2026 Private Archive</p>
  </footer>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/links.js"></script>
  <script src="assets/js/articles.js"></script>
  <script src="assets/js/search.js"></script>
  <script src="assets/js/nav.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
